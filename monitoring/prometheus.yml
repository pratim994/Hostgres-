global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: patroni
    metrics_path: /metrics
    static_configs:
      - targets:
          - pg1:8008
          - pg2:8008
          - pg3:8008
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter-pg1:9187, postgres-exporter-pg2:9187, postgres-exporter-pg3:9187]
  - job_name: etcd
    metrics_path: /metrics
    static_configs:
      - targets: [etcd1:2381, etcd2:2381, etcd3:2381]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: [haproxy:8404]
