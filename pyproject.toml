[project]
name = "postgresql-ha-failover-lab"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["psycopg2-binary==2.9.10"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.8,<1", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
